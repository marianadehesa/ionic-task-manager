<ion-header [translucent]="true" class="ion-no-border" color="tertiary">
  <ion-toolbar color="primary">
    <ion-title>
      Pendientes
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-list >
    <ion-item *ngFor="let lista of tareasService.listas" detail=""
    (click)="seleccionarLista(lista)"color="secondary">
      <ion-label>
        {{lista.titulo}}
      </ion-label>
      <ion-note color="light" slot="end"></ion-note>
        {{lista.items.length}} tareas
    </ion-item>
  </ion-list>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" (click)="agregarLista()">
    <ion-fab-button>
      <ion-icon name=add></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
